<div class="wrapper">
  <div class="choose_file">
    <label for="choose_file">
      <input type="file" id="choose_file" (change)="onFileSelected($event)" />
      <i class="fas fa-cloud-upload-alt" aria-hidden="true"></i>
      @if (selectedFile(); as file) {
        <p>{{ file.name }}</p>
      } @else {
        <p>Browse File to Upload</p>
      }
    </label>
  </div>
  <button type="button" class="submit_btn" [disabled]="!selectedFile() || isUploading()" (click)="UploadTempalteFile()">
    Transmite
  </button>
</div>
